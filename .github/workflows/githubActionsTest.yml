name: Run Qase Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
#      - 'feature/*'
#      - 'master'

jobs:
  build:

    runs-on: ubuntu-latest
#    permissions:
#      security-events: write
#      contents: write

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Run Smoke Tests
        run: mvn clean test -Duser=$USER -Dpassword=$PASSWORD -Dtoken=$TOKEN -DsuiteXmlFile='src/test/resources/SmokeTest.xml'
        env:
          USER: ${{ secrets.QASE_LOGIN }}
          PASSWORD: ${{ secrets.QASE_PASSWORD }}
          TOKEN: ${{ secrets.QASE_API_TOKEN }}

