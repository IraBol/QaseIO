# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Run Qase Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Run Smoke Tests
        run: mvn clean test -Duser=$USER -Dpassword=$PASSWORD -Durl=$URL -Dtoken=$TOKEN -DsuiteXmlFile='src/test/resources/SmokeTest.xml'
        env:
          USER: ${{ secrets.QASE_LOGIN }}
          PASSWORD: ${{ secrets.QASE_PASSWORD }}
          URL: ${{ secrets.QASE_API_URL }}
          TOKEN: ${{ secrets.QASE_API_TOKEN }}


